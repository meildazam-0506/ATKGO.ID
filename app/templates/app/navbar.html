{% load static %}
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{% if request.user.is_authenticated %}{% url 'beranda' %}{% else %}{% url 'landing' %}{% endif %}">
      <img src="{% static 'assets/img/logo.png' %}" width="47" height="48" alt="Logo ATKGO.ID">
      <span>ATK<span class="go">GO</span>.ID</span>
    </a>

    <nav id="mainNav" aria-label="Menu utama">
      {% if request.user.is_authenticated %}
        <!-- Navbar Pengguna Sudah Login: Beranda, Layanan, Artikel, Tentang, Kontak -->
        <a href="{% url 'beranda' %}" {% if request.resolver_match.url_name == 'beranda' %}class="active" aria-current="page"{% endif %}>Beranda</a>
        <a href="{% url 'produk' %}" {% if request.resolver_match.url_name == 'produk' %}class="active" aria-current="page"{% endif %}>Layanan</a>
        <a href="{% url 'artikel_list' %}" {% if request.resolver_match.url_name == 'artikel_list' or request.resolver_match.url_name == 'artikel_detail' %}class="active" aria-current="page"{% endif %}>Artikel</a>
        <a href="{% url 'tentang' %}" {% if request.resolver_match.url_name == 'tentang' %}class="active" aria-current="page"{% endif %}>Tentang</a>
        <a href="{% url 'kontak' %}" {% if request.resolver_match.url_name == 'kontak' %}class="active" aria-current="page"{% endif %}>Kontak</a>
      {% else %}
        <!-- Navbar Konsisten Sebelum Login/Register: Beranda, Tentang, Artikel, Kontak -->
        <a href="{% url 'beranda' %}" {% if request.resolver_match.url_name == 'beranda' or request.resolver_match.url_name == 'landing' %}class="active" aria-current="page"{% endif %}>Beranda</a>
        <a href="{% url 'tentang' %}" {% if request.resolver_match.url_name == 'tentang' %}class="active" aria-current="page"{% endif %}>Tentang</a>
        <a href="{% url 'artikel_list' %}" {% if request.resolver_match.url_name == 'artikel_list' or request.resolver_match.url_name == 'artikel_detail' %}class="active" aria-current="page"{% endif %}>Artikel</a>
        <a href="{% url 'kontak' %}" {% if request.resolver_match.url_name == 'kontak' %}class="active" aria-current="page"{% endif %}>Kontak</a>
      {% endif %}
    </nav>

    {% if request.user.is_authenticated %}
      <!-- Grup Aksi Pengguna: Keranjang, Profil, Logout (Rapi & Proporsional UI/UX) -->
      <div class="nav-user-actions">
        <!-- Ikon Keranjang -->
        <a href="{% url 'keranjang' %}" class="cart-nav" aria-label="Buka keranjang" title="Keranjang Belanja">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span id="cart-count" class="cart-count">0</span>
        </a>

        <!-- Tombol Profil Pengguna -->
        <a href="{% url 'profil' %}" class="profile-button {% if request.resolver_match.url_name == 'profil' %}active{% endif %}" aria-label="Profil Akun Saya" title="Profil Saya">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

        <!-- Tombol Logout -->
        <form method="POST" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="logout-button" aria-label="Logout" title="Keluar dari akun">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </form>
      </div>
    {% else %}
      <a class="nav-cta" href="{% url 'login' %}">Login / Register</a>
    {% endif %}

    <button class="menu" id="menuBtn" type="button" aria-label="Buka menu" aria-controls="mainNav" aria-expanded="false">☰</button>
  </div>
</header>
